<style>
html{scroll-behavior:smooth;scroll-padding-top:120px}body{font-size:16px!important;line-height:1.75!important}.wrap{max-width:960px}.section,.day{scroll-margin-top:120px}.reader-nav{position:sticky;top:0;z-index:20;background:#fbf8f3f5;backdrop-filter:blur(12px);border-bottom:1px solid #e8dfd2;padding:8px max(12px,calc((100vw - 936px)/2))}.reader-nav .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}.reader-nav a{flex:none;display:flex;align-items:center;min-height:44px;padding:8px 14px;border:1px solid #dacdbb;border-radius:22px;background:white;color:#0e3f5c;text-decoration:none;font-size:15px}.reader-note{background:#eef5f6;border-left:4px solid #1e5f8b;border-radius:12px;padding:16px;margin:14px 0}.reader-note h4{font-size:17px;margin-bottom:8px}.reader-note p{margin:8px 0}.reader-note.warning{background:#fff0df;border-color:#b5462e}.reader-details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}.reader-map{width:100%;height:auto;background:#f4efe4;border-radius:12px;display:block;margin:12px 0}.reader-map text{font-family:system-ui,sans-serif}.reader-map-tabs{display:flex;flex-wrap:wrap;gap:8px}.reader-map-tabs button{font:inherit;min-height:44px;padding:8px 14px;border:1px solid #c7bda9;border-radius:18px;background:#fff;color:#0e3f5c}.reader-map-tabs button[aria-pressed=true]{background:#0e3f5c;color:white}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #ad592b;outline-offset:3px}.reader-map-key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-size:16px}.reader-map-key a{display:block;min-height:44px;padding:6px;color:#0e3f5c}.reader-caption{font-size:16px;color:#5c5045}.day-insight .ir{flex-wrap:wrap}.day-insight .it{white-space:normal}.reader-note li{margin:8px 0}

<script>
const NOTES=__REFERENCE_NOTES__;
(()=>{
 const make=(tag,text,cls)=>{const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e};
 const sections=[...document.querySelectorAll('.section')],days=[...document.querySelectorAll('.day')];
 const nav=make('nav',null,'reader-nav');nav.setAttribute('aria-label','攻略章节与日期');const modules=make('div',null,'row'),dates=make('div',null,'row');
 sections.forEach((s,i)=>{s.id='chapter-'+i;const a=make('a',s.querySelector('h2')?.textContent.trim());a.href='#'+s.id;modules.append(a)});
 days.forEach((d,i)=>{d.id='day-'+(i+1);const a=make('a','D'+(i+1));a.href='#'+d.id;dates.append(a)});nav.append(modules,dates);document.querySelector('.hero').after(nav);
 const intro=make('aside',null,'reader-note warning');intro.append(make('h4',NOTES.title||'完整攻略 · 手机详细版'));for(const t of NOTES.disclosure||[])intro.append(make('p',t));document.querySelector('.wrap').prepend(intro);
 // Attach column headings without rewriting, shortening or losing cell contents.
 document.querySelectorAll('table').forEach(table=>{const labels=[...table.querySelectorAll('thead tr:first-child th')].map(t=>t.textContent.trim());table.querySelectorAll('tbody tr').forEach(row=>{let col=0;[...row.children].forEach(cell=>{cell.dataset.label=labels[col]||'说明';col+=cell.colSpan||1})})});
 NOTES.days.forEach(item=>{const target=days[item.day-1];if(!target)return;const box=make('aside',null,'reader-note');box.append(make('h4','D'+item.day+' · 新增执行建议'));for(const point of item.advice||[])box.append(make('p',point));if(item.warning){const warning=make('p','待确认：'+item.warning);warning.style.color='#9b3f24';box.append(warning)}target.querySelector('h3').after(box)});
 if(NOTES.conflicts?.length){const box=make('aside',null,'reader-note warning');box.append(make('h4','原文保留，但这些内容不能直接照着执行'));NOTES.conflicts.forEach(t=>box.append(make('p',t)));intro.after(box)}
 // New map uses approximate coordinates, one geographic distance scale per view.
 if(NOTES.map?.length){const box=make('div',null,'card'),tabs=make('div',null,'reader-map-tabs'),root=document.createElementNS('http://www.w3.org/2000/svg','svg'),key=make('div',null,'reader-map-key');root.setAttribute('viewBox','0 0 600 500');root.setAttribute('class','reader-map');root.setAttribute('role','img');root.setAttribute('aria-label','分区域相对比例路线地图');box.append(make('h3','按地区查看 · 相对比例地图'),tabs,root,key,make('p','北向朝上 · 约略坐标用于方向和距离比例；虚线是访问顺序，不是实际道路。比例尺是直线距离，不能推算驾驶时间。原稿地图保留在下方作对照。','reader-caption'));
 const ns='http://www.w3.org/2000/svg',v=(tag,attrs,text)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,x])=>e.setAttribute(k,x));if(text)e.textContent=text;return e};
 const views=['全程',...new Set(NOTES.map.map(p=>p.region))];function draw(view){root.replaceChildren();key.replaceChildren();const points=NOTES.map.filter(p=>view==='全程'||p.region===view),lat=points.reduce((a,b)=>a+b.lat,0)/points.length,xy=p=>[p.lng*111.195*Math.cos(lat*Math.PI/180),-p.lat*111.195],coords=points.map(xy),xs=coords.map(p=>p[0]),ys=coords.map(p=>p[1]),cx=(Math.max(...xs)+Math.min(...xs))/2,cy=(Math.max(...ys)+Math.min(...ys))/2,scale=Math.max((Math.max(...xs)-Math.min(...xs))/400,(Math.max(...ys)-Math.min(...ys))/340,.001),project=p=>{const [x,y]=xy(p);return [300+(x-cx)/scale,215+(y-cy)/scale]};
 for(let x=0;x<600;x+=50)root.append(v('line',{x1:x,y1:0,x2:x,y2:500,stroke:'#e2dacc'}));for(let y=0;y<500;y+=50)root.append(v('line',{x1:0,y1:y,x2:600,y2:y,stroke:'#e2dacc'}));
 for(let i=1;i<points.length;i++){const [x1,y1]=project(points[i-1]),[x2,y2]=project(points[i]);root.append(v('line',{x1,y1,x2,y2,stroke:'#95705a','stroke-width':3,'stroke-dasharray':'8 7'}))}
 points.forEach((p,i)=>{const [x,y]=project(p),c=p.region==='埃及'?'#1e5f8b':'#b5462e';root.append(v('circle',{cx:x,cy:y,r:18,fill:c,stroke:'white','stroke-width':3}),v('text',{x,y:y+6,fill:'white','font-size':18,'font-weight':700,'text-anchor':'middle'},String(i+1)));const a=make('a',(i+1)+' · '+p.name+'（'+p.days+'）');a.href='#day-'+p.day;key.append(a)});
 const target=scale*110,pow=10**Math.floor(Math.log10(target)),n=target/pow,length=(n>=5?5:n>=2?2:1)*pow;root.append(v('rect',{x:15,y:425,width:240,height:62,fill:'white',rx:12}),v('path',{d:'M30 471 v-8 h'+(length/scale)+' v8',stroke:'#233a3d',fill:'none','stroke-width':3}),v('text',{x:30,y:451,fill:'#233a3d','font-size':23},'约 '+Number(length.toPrecision(3))+' 公里'),v('text',{x:555,y:36,'font-size':24,fill:'#233a3d'},'↑ N'));[...tabs.children].forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===view)))}
 views.forEach(view=>{const b=make('button',view);b.type='button';b.onclick=()=>draw(view);tabs.append(b)});sections[0]?.querySelector('h2').after(box);draw('全程')}
})();
</script>
