<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TRIP_TITLE__ · 随身行程</title>
<style>
:root{--ink:#183034;--muted:#52686b;--brand:#1f6f78;--line:#dce4e2;--paper:#f7f5ef}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"PingFang SC",sans-serif;font-size:16px;line-height:1.6}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #257f9b;outline-offset:3px}.page{max-width:1100px;margin:auto;padding:24px 20px 60px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--brand)}h1{font-size:28px;line-height:1.25;margin:10px 0}h2{font-size:21px;margin:0 0 8px}p{margin:8px 0;overflow-wrap:anywhere}.subtitle,.muted{color:var(--muted)}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0;position:sticky;top:0;background:var(--paper);z-index:2}.tabs button{flex:none;min-height:44px;border:1px solid var(--line);border-radius:24px;background:#fff;padding:8px 18px}.tabs button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}.map-panel,.day,.extra{border:1px solid var(--line);border-radius:20px;background:#fff;padding:18px;min-width:0}.map-panel{position:sticky;top:76px}.map-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.map-title h2{font-size:18px}.map-title button{min-height:44px;border:0;border-radius:12px;background:#edf5f3;color:var(--brand);padding:8px 12px;flex:none}.map-svg{display:block;width:100%;aspect-ratio:1/1;background:#f1f6f4;border-radius:14px;margin:12px 0}.map-note{font-size:14px;color:var(--muted)}.day{margin-bottom:16px}.day-tag{font-weight:800;font-size:14px;color:var(--brand)}.stop{border-top:1px solid var(--line);padding:18px 0 8px}.stop-head{display:flex;gap:10px;align-items:start}.number{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}.stop-name{font-size:18px;font-weight:750;line-height:1.45;overflow-wrap:anywhere;min-width:0}.stop-time{font-size:16px;color:var(--brand);font-weight:700}.stop button{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--brand)}.leg{border-left:3px dotted var(--line);padding:6px 12px;margin:8px 0;color:var(--muted)}.alternative{background:#fff5df;border-radius:12px;padding:12px;margin-top:12px}.extra{margin-top:16px}details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}a{color:var(--brand);display:inline-block;padding:8px 0;overflow-wrap:anywhere}.svg-pin{cursor:pointer}.svg-pin:focus{outline:none}.svg-pin:focus circle{stroke:#183034;stroke-width:4}
@media(max-width:760px){.page{padding:20px 16px calc(36px + env(safe-area-inset-bottom))}.layout{display:block}.map-panel{position:static;margin-bottom:16px;padding:14px}.map-svg{aspect-ratio:1.12/1}.day{padding:18px 16px}.tabs{margin:0 -16px;padding:12px 16px}h1{font-size:26px}}
</style>
</head>
<body>
<main class="page"><header><div class="eyebrow">随身旅行手册</div><h1 id="title"></h1><p class="subtitle" id="subtitle"></p><div id="overview"></div></header><nav class="tabs" id="tabs" aria-label="选择行程日期"></nav><div class="layout"><section class="map-panel"><div class="map-title"><h2 id="map-title">行程示意图</h2><button id="reset" type="button">恢复全图</button></div><svg id="map" class="map-svg" viewBox="0 0 480 440" role="group" aria-label="带比例尺的行程示意地图"></svg><p class="map-note">北向朝上 · 虚线表示游览顺序<br>比例尺表示约直线距离，交通耗时见行程卡片。</p></section><section id="days" aria-label="每日详细行程"></section></div><section id="extras"></section></main>
<script>const TRIP=__TRIP_DATA__;</script>
<script>
const palette=['#bb482c','#287a70','#6252a2','#9d6713','#1f6e99'];
const modes={walk:'步行',transit:'公共交通',drive:'自驾',bike:'骑行',ferry:'轮渡',train:'铁路',flight:'航班',other:'转场'};
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
let active=TRIP.days[0].day;
function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}
function addText(parent,value){for(const line of(Array.isArray(value)?value:[value]))if(line)parent.append(el('p',String(line)))}
function svg(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!=null)e.textContent=text;return e}
function color(day){return /^#[0-9a-f]{6}$/i.test(day.color||'')?day.color:palette[(day.day-1)%palette.length]}
function source(parent,url){try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))return;const a=el('a','查看来源');a.href=u.href;a.target='_blank';a.rel='noopener';parent.append(a)}catch{}}
function selected(){return active==='all'?TRIP.days:TRIP.days.filter(d=>d.day===active)}
function drawMap(focus){const root=$('map');root.replaceChildren();const ds=selected(),stops=ds.flatMap(d=>d.stops.map(s=>({...s,day:d.day,color:color(d)})));if(!stops.length)return;
 // 局部距离近似：东西距离按平均纬度修正，南北距离按纬度差。
 const lat0=stops.reduce((v,s)=>v+s.lat,0)/stops.length,lon0=stops[0].lng,cos=Math.cos(lat0*Math.PI/180);
 const xy=s=>[(((s.lng-lon0+540)%360)-180)*111.195*cos,-(s.lat-lat0)*111.195];
 const coords=stops.map(xy),xs=coords.map(p=>p[0]),ys=coords.map(p=>p[1]);let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
 let span=Math.max((maxX-minX)/360,(maxY-minY)/300,.0005),midX=(minX+maxX)/2,midY=(minY+maxY)/2;
 if(focus){const p=xy(focus);midX=p[0];midY=p[1];span=Math.max(span/2,.0005)}
 const project=s=>{const p=xy(s);return[240+(p[0]-midX)/span,205+(p[1]-midY)/span]};
 for(let x=0;x<=480;x+=40)root.append(svg('line',{x1:x,y1:0,x2:x,y2:440,stroke:'#e2ebe7'}));for(let y=0;y<=440;y+=40)root.append(svg('line',{x1:0,y1:y,x2:480,y2:y,stroke:'#e2ebe7'}));
 for(const d of ds){const by=Object.fromEntries(d.stops.map(s=>[s.order,s]));const legs=d.legs?.length?d.legs:d.stops.slice(1).map((s,i)=>({from:d.stops[i].order,to:s.order}));for(const l of legs){const a=project(by[l.from]),b=project(by[l.to]);root.append(svg('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:color(d),'stroke-width':3,'stroke-dasharray':'6 7',opacity:.7}))}}
 for(const s of stops){const p=project(s),g=svg('g',{class:'svg-pin',tabindex:0,role:'button','aria-label':'第'+s.day+'天第'+s.order+'站 '+s.name});g.append(svg('title',{},s.name),svg('circle',{cx:p[0],cy:p[1],r:36,fill:'transparent'}),svg('circle',{cx:p[0],cy:p[1],r:22,fill:s.color,stroke:'#fff','stroke-width':3}),svg('text',{x:p[0],y:p[1]+4,'text-anchor':'middle',fill:'#fff','font-size':18,'font-weight':800},s.day+'-'+s.order));const select=()=>document.getElementById('stop-'+s.day+'-'+s.order)?.scrollIntoView({behavior:'smooth',block:'center'});g.onclick=select;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}};root.append(g)}
 const target=span*90,pow=10**Math.floor(Math.log10(target)),n=target/pow,nice=(n>=5?5:n>=2?2:1)*pow,width=nice/span;
 root.append(svg('rect',{x:14,y:368,width:205,height:60,rx:10,fill:'#fff',opacity:.95}),svg('path',{d:'M 28 398 v 7 h '+width+' v -7',fill:'none',stroke:'#183034','stroke-width':2}),svg('text',{x:28,y:390,'font-size':25,fill:'#183034'},'约 '+(nice<1?Math.round(nice*1000)+' 米':Number(nice.toPrecision(3))+' 公里')),svg('text',{x:436,y:34,'font-size':20,'font-weight':800,fill:'#183034'},'↑ N'));
 $('map-title').textContent=active==='all'?'全程相对位置':'第 '+active+' 天 · 相对位置';
}
function bookingCard(item){const box=el('div',null,'stop'),labels={booked:'已订',pending:'待订',optional:'可选',cancelled:'已取消'};box.append(el('strong',item.name||item.id),el('p',(item.included_in?'套餐已含':labels[item.status])+(item.paid===true?' · 已付':item.status==='booked'&&!item.included_in?' · 付款状态未确认':'')));if(item.included_in){const p=(TRIP.bookings||[]).find(b=>b.id===item.included_in);box.append(el('p','已含在：'+(p?.name||item.included_in)+'，不重复计费'))}else if(item.amount!=null)box.append(el('p',item.amount+' '+(item.currency||TRIP.base_currency||'CNY')+' · 同行者合计'));if(item.deadline)box.append(el('p','建议截止：'+item.deadline));if(item.priority)box.append(el('p','优先级：'+item.priority));addText(box,item.note);return box}
function dailyBooking(card,d){const items=(TRIP.bookings||[]).filter(b=>b.status!=='cancelled'&&(b.day===d.day||(d.booking_ids||[]).includes(b.id)));if(items.length){const box=el('details');box.open=true;box.append(el('summary','今日预订与待办'));for(const b of items)box.append(bookingCard(b));card.append(box)}}
function render(){for(const b of $('tabs').children)b.setAttribute('aria-pressed',String(b.dataset.day===String(active)));$('days').replaceChildren();for(const d of selected()){const card=el('article',null,'day');card.append(el('div','第 '+d.day+' 天'+(d.date?' · '+d.date:''),'day-tag'),el('h2',d.title||'今日行程'));addText(card,d.summary);
 if(d.stay){card.append(el('strong','今晚住宿'));addText(card,d.stay)}if(d.warnings){const warning=el('div',null,'alternative');warning.append(el('strong','今天特别注意'));addText(warning,d.warnings);card.append(warning)}dailyBooking(card,d);
 for(const s of d.stops){const stop=el('section',null,'stop');stop.id='stop-'+d.day+'-'+s.order;const head=el('div',null,'stop-head'),num=el('span',String(s.order),'number');num.style.background=color(d);head.append(num,el('div',s.name,'stop-name'));stop.append(head,el('p',[s.time,s.category].filter(Boolean).join(' · '),'stop-time'));addText(stop,s.note);const btn=el('button','在图上定位');btn.type='button';btn.onclick=()=>{drawMap(s);$('map').scrollIntoView({behavior:'smooth',block:'center'})};stop.append(btn);if(s.source_url){const details=el('details');details.append(el('summary','地点来源'));source(details,s.source_url);stop.append(details)}card.append(stop);for(const l of d.legs||[]){if(l.from!==s.order)continue;const to=d.stops.find(p=>p.order===l.to);const parts=['→ '+to.name,modes[l.mode]||'转场'];if(l.duration_min!=null)parts.push('约 '+l.duration_min+' 分钟');if(l.distance_km!=null)parts.push('路程约 '+l.distance_km+' 公里');card.append(el('p',parts.join(' · '),'leg'));addText(card,l.note)}}
 for(const[key,label]of Object.entries({meals:'今天吃什么',highlights:'今日亮点',culture:'历史与文化'})){if(!d[key])continue;const box=el('details');if(key==='meals')box.open=true;box.append(el('summary',label));addText(box,d[key]);card.append(box)}
 if(d.alternative){const alt=el('div',null,'alternative');alt.append(el('strong','临场备选'));addText(alt,d.alternative);card.append(alt)}$('days').append(card)}drawMap()}
$('title').textContent=TRIP.title;$('subtitle').textContent=TRIP.subtitle||'';addText($('overview'),TRIP.overview);
for(const d of [...TRIP.days,{day:'all',title:'全程'}]){const btn=el('button',d.day==='all'?'全程总览':'第 '+d.day+' 天');btn.type='button';btn.dataset.day=d.day;btn.onclick=()=>{active=d.day;render();$('tabs').scrollIntoView({behavior:'smooth',block:'start'})};$('tabs').append(btn)}
for(const[key,label]of Object.entries({preparations:'行前清单',accommodation:'住宿建议',budget:'预算',risks:'提醒与避坑',sources:'资料来源'})){if(!TRIP[key])continue;const box=el('details',null,'extra');box.append(el('summary',label));addText(box,TRIP[key]);$('extras').append(box)}
$('reset').onclick=()=>drawMap();render();
if(TRIP.guide_sections?.length){const nav=el('nav',null,'tabs');nav.setAttribute('aria-label','攻略章节');for(const part of TRIP.guide_sections){const section=el('section',null,'extra');section.id='guide-'+part.id;section.append(el('h2',part.title));addText(section,part.paragraphs);for(const entry of part.cards||[]){const card=el('article',null,'stop');card.append(el('h3',entry.title));addText(card,entry.paragraphs);section.append(card)}$('extras').append(section);const a=el('a',part.title);a.href='#'+section.id;a.style.flex='none';a.style.minHeight='44px';nav.append(a)}$('overview').after(nav)}
if(TRIP.bookings?.length){const section=el('section',null,'extra'),s=TRIP.booking_summary;section.append(el('h2','全程预订与费用'));section.append(el('p','独立预订：已订 '+s.booked_count+' / '+s.total_count+' 项 · 待订 '+s.pending_count+' 项'));section.append(el('p','已知金额小计 '+s.known_total+' '+s.currency+' · 已确认付款 '+s.known_paid+' '+s.currency));if(s.per_person)section.append(el('p','已知金额人均 '+s.per_person+' '+s.currency));if(s.missing_prices.length)section.append(el('p','尚缺金额或汇率：'+s.missing_prices.join('、')+'，以上并非完整总预算。'));const detail=el('details');detail.append(el('summary','展开预订明细（含可选与取消项）'));for(const item of TRIP.bookings)detail.append(bookingCard(item));section.append(detail);$('extras').prepend(section)}
</script>
</body>
</html>
